<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Famille Localizer - Dev.Assamoi</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <style>#map{height:72vh;width:100%}</style>
</head>
<body class="font-sans antialiased bg-gray-50">

  <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-lg font-bold">📍 Famille Localizer</h1>
    <span id="user-badge" class="bg-blue-700 text-xs px-3 py-1 rounded-full hidden font-medium shadow-sm">
      Mon ID : <span id="my-id">--</span>
    </span>
  </header>

  <!-- Écran 1 : Inscription -->
  <div id="auth-screen" class="max-w-md mx-auto mt-12 p-6 bg-white rounded-2xl shadow-xl border border-gray-100">
    <h2 class="text-xl font-bold mb-2 text-gray-800">Rejoindre le réseau</h2>
    <p class="text-xs text-gray-500 mb-6">Entrez votre prénom. Un ID unique vous sera attribué.</p>
    
    <form id="auth-form" class="space-y-4" novalidate>
      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">PRÉNOM / NOM</label>
        <input type="text" id="username" placeholder="Ex: Jean Assamoi" autocomplete="off" 
          class="w-full px-4 py-2.5 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition text-sm">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-xl font-semibold hover:bg-blue-700 transition shadow-md">
        Obtenir mon ID & Démarrer
      </button>
    </form>
  </div>

  <!-- Écran 2 : App -->
  <div id="app-screen" class="hidden">
    <div class="p-3 bg-white shadow-sm flex gap-2 border-b">
      <input type="number" id="target-id" placeholder="ID du membre (ex: 2)" 
        class="flex-1 px-4 py-2 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      <button type="button" onclick="observerAmi()" class="bg-blue-600 text-white px-5 py-2 rounded-xl text-sm font-semibold hover:bg-blue-700">Localiser</button>
    </div>
    <div id="map"></div>
    <div class="p-3 bg-white border-t flex justify-between items-center text-xs">
      <div class="flex items-center gap-2">
        <span id="status-dot" class="w-3 h-3 rounded-full bg-gray-400"></span>
        <span id="status-text" class="font-medium text-gray-700">GPS en attente...</span>
      </div>
      <span id="battery-text" class="text-gray-500 font-semibold"></span>
    </div>
  </div>

  <!-- ORDRE CORRECT : Supabase -> Leaflet -> App -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
